<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Travel Website</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <header>
        <nav>
            <h2 class="logo"><a href="home.html">Travel</a></h2>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="tour.html">Tours</a></li>
                <li><a href="booking.html">Booking</a></li>
                <li><a href="customer.html">Customer</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="auth-section">

            <!-- FORM ĐĂNG NHẬP -->
            <div id="login-box">
                <h2>Log in</h2>

                <label for="login-email">Email</label><br>
                <input type="email" id="login-email" placeholder="Nhập email"><br><br>

                <label for="login-password">Mật khẩu</label><br>
                <input type="password" id="login-password" placeholder="Nhập mật khẩu"><br><br>

                <p id="login-error" style="color: red;"></p>

                <button id="login-btn">Đăng Nhập</button>

                <p>Chưa có tài khoản? <a href="#" id="go-to-register">Đăng ký</a></p>
            </div>

            <!-- FORM ĐĂNG KÝ (ẩn mặc định) -->
            <div id="register-box" style="display: none;">
                <h2>Đăng Ký</h2>

                <label for="register-username">Tên</label><br>
                <input type="text" id="register-username" placeholder="Nhập tên của bạn"><br><br>

                <label for="register-email">Email</label><br>
                <input type="email" id="register-email" placeholder="Nhập email"><br><br>

                <label for="register-password">Mật khẩu</label><br>
                <input type="password" id="register-password" placeholder="Nhập mật khẩu"><br><br>

                <label for="register-phone">Số điện thoại</label><br>
                <input type="tel" id="register-phone" placeholder="Nhập số điện thoại"><br><br>

                <p id="register-error" style="color: red;"></p>

                <button id="register-btn">Đăng Ký</button>

                <p>Đã có tài khoản? <a href="#" id="go-to-login">Đăng nhập</a></p>
            </div>

        </section>
    </main>

    <footer>
        <p>2026 Travel Website</p>
        <p>Email: travel@gmail.com</p>
        <p>Phone: 0123456789</p>
        <a href="https://www.facebook.com/le.uc.381290/">Facebook</a>
        <a href="https://www.instagram.com/">Instagram</a>
        <a href="#">Twitter</a>
    </footer>

    <script src="../SERVICES/authServices.js"></script>
    <script src="../MODULES/auth.js"></script>

</body>

</html>
